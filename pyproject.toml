[project]
name = "dev-radar"
version = "0.1.0"
description = "An MCP host that fans out to git, Hacker News and system-health MCP servers and writes a daily engineering briefing."
readme = "README.md"
license = "MIT"
authors = [
    { name = "sakshamchitkara-dotcom", email = "275204628+sakshamchitkara-dotcom@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.8.0",
    "httpx>=0.28.1",
    "mcp>=2.2.0",
    "psutil>=7.2.2",
]

[project.scripts]
dev-radar = "dev_radar.cli:main"
dev-radar-git = "dev_radar.servers.git_insights:main"
dev-radar-hn = "dev_radar.servers.hn_trends:main"
dev-radar-system = "dev_radar.servers.system_health:main"
dev-radar-github = "dev_radar.servers.github_activity:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
